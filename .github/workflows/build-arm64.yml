name: Build Amadeus ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Patch build.sh for GitHub Actions
  working-directory: ex
  run: |
    sed -i 's/podman run -it/podman run/g' build.sh
    sed -i '1a set -e' build.sh
    sed -i 's/-march=haswell/-march=native/g' build.sh
    sed -i 's/-C target-cpu=haswell/-C target-cpu=native/g' build.sh
    chmod +x build.sh

      - name: Build builder image
        working-directory: ex
        run: |
          podman build \
            --tag erlang_builder \
            --file build.Dockerfile .

      - name: Build Amadeus
        working-directory: ex
        run: |
          set -euxo pipefail
          ./build.sh

      - name: Find Amadeus binary
        working-directory: ex
        run: |
          echo "=== Searching for binary ==="
          find . -type f \( -name "ama" -o -name "amadeusd" \) -print

          if [ -f amadeusd ]; then
            echo "Found amadeusd"
          else
            AMA=$(find . -type f -name "ama" -print -quit)

            if [ -z "$AMA" ]; then
              echo "ERROR: ama binary was not found"
              exit 1
            fi

            echo "Found ama at: $AMA"
            cp "$AMA" amadeusd
            chmod +x amadeusd
          fi

      - name: Verify binary
        working-directory: ex
        run: |
          ls -lh amadeusd
          file amadeusd
          sha256sum amadeusd

      - name: Upload amadeusd
        uses: actions/upload-artifact@v4
        with:
          name: amadeusd-arm64
          path: ex/amadeusd
          retention-days: 7