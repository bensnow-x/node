name: Build Amadeus ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman python3

      - name: Patch ARM64 sources
        working-directory: ex
        run: |
          python3 <<'PY'
          from pathlib import Path

          # ============================================================
          # Patch build.sh
          # ============================================================
          p = Path("build.sh")
          s = p.read_text()

          s = s.replace("podman run -it", "podman run")
          s = s.replace("-march=haswell", "-march=native")
          s = s.replace("-C target-cpu=haswell", "-C target-cpu=native")
          s = s.replace("erlang_builder", "localhost/erlang_builder")

          p.write_text(s)

          # ============================================================
          # Patch sol_freivalds.rs
          # ============================================================
          p = Path("native/rdb/src/consensus/bic/sol_freivalds.rs")
          s = p.read_text()

          s = s.replace(
              "use std::arch::x86_64::*;",
              '#[cfg(target_arch = "x86_64")]\nuse std::arch::x86_64::*;'
          )

          old = '''pub fn freivalds_inner(Rs: &[[i8; 16]; 3], A: &[[u8; 50_240]; 16], B: &[[i8; 16]; 50_240], C: &[[i32; 16]; 16]) -> bool {
              if std::is_x86_feature_detected!("avx2") {
                  unsafe { freivalds_inner_avx2(Rs, A, B, C) }
              } else {
                  freivalds_inner_scalar(Rs, A, B, C)
              }
          }'''

          new = '''pub fn freivalds_inner(
              Rs: &[[i8; 16]; 3],
              A: &[[u8; 50_240]; 16],
              B: &[[i8; 16]; 50_240],
              C: &[[i32; 16]; 16],
          ) -> bool {
              #[cfg(target_arch = "x86_64")]
              {
                  if std::is_x86_feature_detected!("avx2") {
                      return unsafe { freivalds_inner_avx2(Rs, A, B, C) };
                  }
              }

              freivalds_inner_scalar(Rs, A, B, C)
          }'''

          if old in s:
              s = s.replace(old, new)

          markers = [
              "unsafe fn hsum256_epi32",
              "unsafe fn hsum256_epi64",
              "unsafe fn dot8_i32_to_i64",
              "unsafe fn acc_i32x8_into_i64",
              "struct I32x16",
              "unsafe fn load_i8x16_as_i32",
              "pub unsafe fn freivalds_inner_avx2",
          ]

          for marker in markers:
              if marker in s:
                  cfg = '#[cfg(target_arch = "x86_64")]'
                  before = cfg + "\n" + marker
                  if before not in s:
                      s = s.replace(marker, before, 1)

          p.write_text(s)

          # ============================================================
          # Patch upow.rs
          # ============================================================
          p = Path("native/rdb/src/upow.rs")
          s = p.read_text()

          s = s.replace(
              "use std::arch::x86_64::*;",
              '#[cfg(target_arch = "x86_64")]\nuse std::arch::x86_64::*;'
          )

          old = '''fn detect_backend() -> Backend {
              if is_x86_feature_detected!("avx512f") && is_x86_feature_detected!("avx512bw") && is_x86_feature_detected!("avx512vnni") {
                  Backend::Avx512Vnni
              } else if is_x86_feature_detected!("avx2") {
                  Backend::Avx2
              } else {
                  Backend::Scalar
              }
          }'''

          new = '''fn detect_backend() -> Backend {
              #[cfg(target_arch = "x86_64")]
              {
                  if is_x86_feature_detected!("avx512f")
                      && is_x86_feature_detected!("avx512bw")
                      && is_x86_feature_detected!("avx512vnni")
                  {
                      return Backend::Avx512Vnni;
                  }

                  if is_x86_feature_detected!("avx2") {
                      return Backend::Avx2;
                  }
              }

              Backend::Scalar
          }'''

          if old in s:
              s = s.replace(old, new)

          markers = [
              '#[target_feature(enable = "avx2")]\nunsafe fn matmul_avx2_fused',
              '#[target_feature(enable = "avx512f,avx512bw,avx512vnni")]\nunsafe fn matmul_avx512_fused',
          ]

          for marker in markers:
              if marker in s:
                  s = s.replace(
                      marker,
                      '#[cfg(target_arch = "x86_64")]\n' + marker,
                      1
                  )

          p.write_text(s)

          print("================================")
          print("ARM64 PATCH COMPLETE")
          print("build.sh: x86 flags -> native")
          print("sol_freivalds.rs: x86 SIMD guarded")
          print("upow.rs: x86 SIMD guarded")
          print("================================")
          PY

          echo "=== Check build flags ==="
          grep -nE 'haswell|march=|target-cpu=' build.sh || true

      - name: Build builder image
        working-directory: ex
        run: |
          podman build \
            --tag localhost/erlang_builder \
            --file build.Dockerfile .

      - name: Build Amadeus
        working-directory: ex
        run: |
          set -euxo pipefail
          ./build.sh

      - name: Find Amadeus binary
        working-directory: ex
        run: |
          set -euxo pipefail

          echo "=== Searching for Amadeus binary ==="
          pwd

          echo "=== Workspace files ==="
          find . -type f \( -name "ama" -o -name "amadeusd" \) -print

          if [ -f "_build/prod/rel/bakeware/ama" ]; then
            echo "Found ama at expected path"
            cp "_build/prod/rel/bakeware/ama" amadeusd
          elif [ -f "amadeusd" ]; then
            echo "Found ./amadeusd"
          else
            AMA=$(find . -type f -name "ama" -print -quit)

            if [ -z "$AMA" ]; then
              echo "ERROR: Amadeus binary was not found"
              exit 1
            fi

            echo "Found ama at: $AMA"
            cp "$AMA" amadeusd
          fi

          chmod +x amadeusd

          echo "=== Final binary ==="
          ls -lh amadeusd
          file amadeusd

      - name: Verify binary
        working-directory: ex
        run: |
          ls -lh amadeusd
          file amadeusd
          sha256sum amadeusd

      - name: Upload amadeusd
        uses: actions/upload-artifact@v4
        with:
          name: amadeusd-arm64
          path: ex/amadeusd
          retention-days: 7