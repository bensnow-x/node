name: Build Amadeus ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Patch ARM64 build flags
        working-directory: ex
        run: |
          sed -i 's/-march=haswell/-march=native/g' build.sh
          sed -i 's/-C target-cpu=haswell/-C target-cpu=native/g' build.sh
          chmod +x build.sh

      - name: Build Amadeus
        working-directory: ex
        run: |
          set -euxo pipefail
          ./build.sh

          echo "=== Files after build ==="
          find . -type f -name "ama" -o -name "amadeusd"

          if [ ! -f amadeusd ]; then
            echo "amadeusd not found, searching for ama..."
            AMA=$(find . -type f -name "ama" -print -quit)

            if [ -z "$AMA" ]; then
              echo "ERROR: ama binary was not found"
              exit 1
            fi

            echo "Found: $AMA"
            cp "$AMA" amadeusd
            chmod +x amadeusd
          fi

          echo "=== amadeusd ==="
          ls -lh amadeusd
          file amadeusd
          sha256sum amadeusd

      - name: Verify binary
        working-directory: ex
        run: |
          test -f amadeusd
          file amadeusd
          sha256sum amadeusd

      - name: Upload amadeusd
        uses: actions/upload-artifact@v4
        with:
          name: amadeusd-arm64
          path: ex/amadeusd
          retention-days: 7